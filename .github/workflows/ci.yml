name: ci

on:
  push:
    branches: [ "dev", "prod" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KAINE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agora_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Go fmt check
        run: |
          test -z "$(gofmt -l .)"
      - name: Go vet
        run: |
            cd agora-backend &&
            go vet ./...
      - name: Run unit + integration tests
        run: |
            cd agora-backend &&
            go test ./... -count=1 -race