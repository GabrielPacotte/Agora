openapi: 3.0.3
info:
  title: Kaine Agora API
  version: 0.1.0
  description: |
    Kaine Agora is an opinion-driven discussion platform built with a clean architecture approach.
    This OpenAPI spec documents the currently implemented HTTP endpoints (v0.1).

    Notes:
    - Access is done via a Bearer JWT (access token).
    - Refresh is done via an HttpOnly cookie (refresh token).
    - Most write operations require authentication.

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Authentication
    description: Register, login, refresh, and logout.
  - name: User
    description: User profile, preferences, and saved content.
  - name: Posts
    description: Create, update, delete, and read posts. Also includes listing and search.
  - name: Comments
    description: Create, update, delete comments and list comment threads.

security:
  - bearerAuth: []

paths:
  /v1/auth/register:
    post:
      tags: [Authentication]
      security: []
      summary: Register a new user and issue tokens
      description: |
        Creates a new user account and immediately returns an access token (JWT) and sets a refresh token cookie.

        The refresh token is stored in an HttpOnly cookie and is not returned in the JSON response body.
      requestBody:
        required: true
        description: Registration payload (login, display name, password).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              example:
                value:
                  login: "johndoe"
                  display_name: "John Doe"
                  password: "a-strong-password"
      responses:
        "201":
          description: User created. Refresh token cookie is set.
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie.
              schema:
                type: string
              example: refresh_token=...; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=2592000
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              examples:
                example:
                  value:
                    token:
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      token_type: "bearer"
                      expires_in: 900
                    user_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    meta: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Login and issue tokens
      description: |
        Verifies user credentials and returns an access token (JWT) and sets a refresh token cookie.

        The refresh token is stored in an HttpOnly cookie and is not returned in the JSON response body.
      requestBody:
        required: true
        description: Login payload.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              example:
                value:
                  login: "johndoe"
                  password: "a-strong-password"
      responses:
        "200":
          description: Login successful. Refresh token cookie is set.
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              examples:
                example:
                  value:
                    token:
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      token_type: "bearer"
                      expires_in: 900
                    user_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    meta: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/refresh:
    post:
      tags: [Authentication]
      security: []
      summary: Rotate refresh token and issue a new access token
      description: |
        Uses the refresh token cookie to rotate the session (revokes the old refresh token and issues a new one),
        and returns a new access token (JWT).

        This endpoint requires the refresh token cookie to be present.
      responses:
        "200":
          description: Refresh successful. A new refresh token cookie is set.
          headers:
            Set-Cookie:
              description: New HttpOnly refresh token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              examples:
                example:
                  value:
                    token:
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      token_type: "bearer"
                      expires_in: 900
                    user_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                    meta: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/logout:
    post:
      tags: [Authentication]
      security: []
      summary: Logout (revoke refresh session)
      description: |
        Revokes the session associated with the refresh token cookie (if any) and clears the refresh token cookie.
        Calling logout multiple times is safe.
      responses:
        "204":
          description: Logged out. Refresh token cookie is cleared.
          headers:
            Set-Cookie:
              description: Cookie cleared by setting Max-Age=0 (implementation-dependent).
              schema:
                type: string
              example: refresh_token=; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=0
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/users/me:
    get:
      tags: [User]
      summary: Get my profile
      description: |
        Returns the authenticated user's public profile.
        Requires a valid Bearer access token.
      responses:
        "200":
          description: Profile returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserProfileResponse"
              examples:
                example:
                  value:
                    user:
                      id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      login: "johndoe"
                      display_name: "John Doe"
                      created_at: "2026-02-06T12:34:56Z"
                      updated_at: "2026-02-06T12:34:56Z"
                    meta: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [User]
      summary: Delete my account
      description: |
        Deletes the authenticated user's account.
        Requires a valid Bearer access token.
      responses:
        "204":
          description: Account deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/users/me/preferences:
    get:
      tags: [User]
      summary: List my tag preferences
      description: |
        Returns the authenticated user's tag preferences.
        If the user has no preferences yet, returns an empty array.
      responses:
        "200":
          description: Preferences returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPreferencesResponse"
              examples:
                empty:
                  value:
                    tags: []
                    meta: {}
                example:
                  value:
                    tags: ["climate", "economy", "ai"]
                    meta: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [User]
      summary: Replace my tag preferences
      description: |
        Replaces the entire preference list with the provided tags.

        Tags are normalized server-side (e.g., trimmed / lowercased) according to the domain rules.
      requestBody:
        required: true
        description: Full preference replacement payload.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPreferencesRequest"
            examples:
              example:
                value:
                  tags: ["climate", "economy", "ai"]
      responses:
        "204":
          description: Preferences updated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/users/me/saved-content:
    get:
      tags: [User]
      summary: List my saved content
      description: |
        Returns the authenticated user's saved content list.
        Supports limit/offset pagination.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Saved content returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSavedContentResponse"
              examples:
                example:
                  value:
                    items:
                      - user_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        content_id: "11111111-1111-1111-1111-111111111111"
                        content_type: "post"
                        created_at: "2026-02-06T12:34:56Z"
                      - user_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        content_id: "22222222-2222-2222-2222-222222222222"
                        content_type: "comment"
                        created_at: "2026-02-06T12:40:00Z"
                    meta:
                      limit: 20
                      offset: 0
                      next_offset: 20
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [User]
      summary: Save a content item
      description: |
        Saves a post or a comment for the authenticated user.
      requestBody:
        required: true
        description: Content identifier and type.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveContentRequest"
            examples:
              savePost:
                value:
                  content_id: "11111111-1111-1111-1111-111111111111"
                  content_type: "post"
      responses:
        "204":
          description: Saved successfully (idempotent).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [User]
      summary: Unsave a content item
      description: |
        Removes a saved post or comment from the authenticated user's saved list.
      requestBody:
        required: true
        description: Content identifier and type.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveContentRequest"
            examples:
              unsavePost:
                value:
                  content_id: "11111111-1111-1111-1111-111111111111"
                  content_type: "post"
      responses:
        "204":
          description: Unsaved successfully (idempotent).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/posts:
    post:
      tags: [Posts]
      summary: Create a post
      description: |
        Creates a new post authored by the authenticated user.

        A post must contain at least 3 unique stances.
      requestBody:
        required: true
        description: Post creation payload.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
            examples:
              example:
                value:
                  title: "Should we ban cars in city centers?"
                  content: "I think we should gradually restrict car access..."
                  tags: ["mobility", "climate"]
                  stances:
                    - label: "Yes"
                      color: "#00aa00"
                      description: "Ban most cars, prioritize public transit."
                    - label: "No"
                      color: "#aa0000"
                      description: "Keep cars, improve efficiency instead."
                    - label: "Mixed"
                      color: "#0000aa"
                      description: "Ban in some areas, allow exceptions."
      responses:
        "201":
          description: Post created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPostResponse"
              examples:
                example:
                  value:
                    post:
                      id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                      author_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      title: "Should we ban cars in city centers?"
                      content: "I think we should gradually restrict car access..."
                      tags: ["mobility", "climate"]
                      stances:
                        - id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
                          label: "Yes"
                          color: "#00aa00"
                          description: "Ban most cars, prioritize public transit."
                        - id: "cccccccc-cccc-cccc-cccc-cccccccccccc"
                          label: "No"
                          color: "#aa0000"
                          description: "Keep cars, improve efficiency instead."
                        - id: "dddddddd-dddd-dddd-dddd-dddddddddddd"
                          label: "Mixed"
                          color: "#0000aa"
                          description: "Ban in some areas, allow exceptions."
                      created_at: "2026-02-06T12:34:56Z"
                      updated_at: "2026-02-06T12:34:56Z"
                    meta: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [Posts]
      summary: Get feed posts
      description: |
        Returns a feed of posts for the authenticated user.
        v0.1 uses a basic strategy (latest posts). This will evolve.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Feed returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPostsResponse"
              examples:
                example:
                  value:
                    posts:
                      - id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                        author_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                        title: "Example post"
                        content: "Post content..."
                        tags: ["ai"]
                        stances:
                          - id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
                            label: "Yes"
                            color: "#00aa00"
                            description: "..."
                          - id: "cccccccc-cccc-cccc-cccc-cccccccccccc"
                            label: "No"
                            color: "#aa0000"
                            description: "..."
                          - id: "dddddddd-dddd-dddd-dddd-dddddddddddd"
                            label: "Mixed"
                            color: "#0000aa"
                            description: "..."
                        created_at: "2026-02-06T12:34:56Z"
                        updated_at: "2026-02-06T12:34:56Z"
                    meta:
                      limit: 20
                      offset: 0
                      next_offset: 20
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/posts/search:
    get:
      tags: [Posts]
      summary: Search posts
      description: |
        Searches posts using optional filters.

        All filters are optional:
        - If `tags` is omitted or empty, no tag filtering is applied.
        - If `from_date` / `to_date` are omitted, no date filtering is applied.
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
        - name: tags
          in: query
          required: false
          description: |
            Filter by tags (repeatable). Example: `?tags=ai&tags=climate`
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: from_date
          in: query
          required: false
          description: Include posts created at or after this timestamp (RFC3339).
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          required: false
          description: Include posts created at or before this timestamp (RFC3339).
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Search results returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPostsResponse"
              examples:
                example:
                  value:
                    posts: []
                    meta:
                      limit: 20
                      offset: 0
                      next_offset: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/posts/{id}:
    get:
      tags: [Posts]
      summary: Get a post by ID
      description: |
        Returns a single post by its ID (public read).
      security: []
      parameters:
        - $ref: "#/components/parameters/PostIDParam"
      responses:
        "200":
          description: Post returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPostResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Posts]
      summary: Delete a post
      description: |
        Deletes a post. Only the author can delete their own post.
      parameters:
        - $ref: "#/components/parameters/PostIDParam"
      responses:
        "204":
          description: Post deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Posts]
      summary: Update a post
      description: |
        Updates a post. Only the author can update their own post.
      parameters:
        - $ref: "#/components/parameters/PostIDParam"
      requestBody:
        required: true
        description: Post update payload (full replacement of editable fields).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
            examples:
              example:
                value:
                  title: "Updated title"
                  content: "Updated content..."
                  tags: ["ai", "ethics"]
                  stances:
                    - id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
                      label: "Yes"
                      color: "#00aa00"
                      description: "..."
                    - id: "cccccccc-cccc-cccc-cccc-cccccccccccc"
                      label: "No"
                      color: "#aa0000"
                      description: "..."
                    - id: "dddddddd-dddd-dddd-dddd-dddddddddddd"
                      label: "Mixed"
                      color: "#0000aa"
                      description: "..."
      responses:
        "200":
          description: Post updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPostResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/posts/{id}/comment:
    post:
      tags: [Comments]
      summary: Create a comment on a post
      description: |
        Creates a comment on a post (root comment or reply).

        - `stance_id` must be one of the stances defined on the post.
        - If `reply_to_id` is provided, the comment becomes a reply to another comment.
      parameters:
        - $ref: "#/components/parameters/PostIDParam"
      requestBody:
        required: true
        description: Comment creation payload.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
            examples:
              root:
                value:
                  stance_id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
                  content: "I strongly agree."
              reply:
                value:
                  stance_id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
                  content: "Replying to your point..."
                  reply_to_id: "eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee"
      responses:
        "201":
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCommentResponse"
              examples:
                example:
                  value:
                    comment:
                      id: "ffffffff-ffff-ffff-ffff-ffffffffffff"
                      post_id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                      author_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                      stance_id: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
                      reply_to_id: null
                      content: "I strongly agree."
                      created_at: "2026-02-06T12:45:00Z"
                      updated_at: "2026-02-06T12:45:00Z"
                    meta: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/posts/{pid}/comment:
    get:
      tags: [Comments]
      summary: List root comments for a post
      description: |
        Lists root comments (comments that are not replies) for a post.
        Supports limit/offset pagination.
      security: []
      parameters:
        - name: pid
          in: path
          required: true
          description: Post ID
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Root comments returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCommentsResponse"
              examples:
                example:
                  value:
                    comments: []
                    meta:
                      limit: 20
                      offset: 0
                      next_offset: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/comments/{id}:
    patch:
      tags: [Comments]
      summary: Update a comment
      description: |
        Updates a comment's content. Only the author can update their own comment.
      parameters:
        - $ref: "#/components/parameters/CommentIDParam"
      requestBody:
        required: true
        description: Comment update payload.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
            examples:
              example:
                value:
                  content: "Edited content."
      responses:
        "200":
          description: Comment updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCommentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Comments]
      summary: Delete a comment
      description: |
        Deletes a comment. Only the author can delete their own comment.
      parameters:
        - $ref: "#/components/parameters/CommentIDParam"
      responses:
        "204":
          description: Comment deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [Comments]
      summary: List replies of a comment
      description: |
        Lists replies to a given comment (thread view).
        Supports limit/offset pagination.
      security: []
      parameters:
        - $ref: "#/components/parameters/CommentIDParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Replies returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCommentsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token, passed as `Authorization: Bearer <token>`.

  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      description: |
        Max number of items to return.
        Server enforces bounds and defaults (see project filters.Page).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    OffsetParam:
      name: offset
      in: query
      required: false
      description: Offset for pagination (>= 0).
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    PostIDParam:
      name: id
      in: path
      required: true
      description: Post ID
      schema:
        type: string
        format: uuid
    CommentIDParam:
      name: id
      in: path
      required: true
      description: Comment ID
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request (JSON body, parameters, or domain validation).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            example:
              value:
                error:
                  code: "invalid_input"
                  message: "invalid json body"
                meta: {}
    Unauthorized:
      description: Missing/invalid authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            example:
              value:
                error:
                  code: "auth_required"
                  message: "unauthorized"
                meta: {}
    Forbidden:
      description: Authenticated but not allowed to perform the action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            example:
              value:
                error:
                  code: "forbidden"
                  message: "forbidden"
                meta: {}
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            example:
              value:
                error:
                  code: "not_found"
                  message: "not found"
                meta: {}
    Conflict:
      description: Conflict (e.g., duplicate user login).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            example:
              value:
                error:
                  code: "conflict"
                  message: "already exists"
                meta: {}
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            example:
              value:
                error:
                  code: "internal"
                  message: "internal server error"
                meta: {}

  schemas:
    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: invalid_input
        message:
          type: string
          description: Human-readable error message.
          example: invalid json body

    EmptyMeta:
      type: object
      description: Reserved for future metadata fields.
      additionalProperties: false

    PageMeta:
      type: object
      required: [limit, offset]
      properties:
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
        next_offset:
          description: Next offset if there is another page; null otherwise.
          nullable: true
          type: integer
          example: 20

    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          $ref: "#/components/schemas/ErrorObject"
        meta:
          $ref: "#/components/schemas/EmptyMeta"

    TokenType:
      type: string
      enum: [bearer]
      example: bearer

    TokenJSON:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: JWT access token.
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          $ref: "#/components/schemas/TokenType"
        expires_in:
          type: integer
          description: Access token TTL in seconds.
          example: 900

    AuthResponse:
      type: object
      required: [token, user_id, meta]
      properties:
        token:
          $ref: "#/components/schemas/TokenJSON"
        user_id:
          type: string
          format: uuid
        meta:
          $ref: "#/components/schemas/EmptyMeta"

    RegisterRequest:
      type: object
      required: [login, display_name, password]
      properties:
        login:
          type: string
          description: Unique login (normalized server-side).
          example: johndoe
        display_name:
          type: string
          description: Public display name.
          example: John Doe
        password:
          type: string
          description: Plain password (never stored as-is).
          example: a-strong-password

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: johndoe
        password:
          type: string
          example: a-strong-password

    UserJSON:
      type: object
      required: [id, login, display_name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
          example: johndoe
        display_name:
          type: string
          example: John Doe
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GetUserProfileResponse:
      type: object
      required: [user, meta]
      properties:
        user:
          $ref: "#/components/schemas/UserJSON"
        meta:
          $ref: "#/components/schemas/EmptyMeta"

    ListPreferencesResponse:
      type: object
      required: [tags, meta]
      properties:
        tags:
          type: array
          items:
            type: string
          example: ["ai", "climate"]
        meta:
          $ref: "#/components/schemas/EmptyMeta"

    SetPreferencesRequest:
      type: object
      required: [tags]
      properties:
        tags:
          type: array
          description: List of tag strings.
          items:
            type: string
          example: ["ai", "climate"]

    ContentType:
      type: string
      enum: [post, comment]
      example: post

    SaveContentRequest:
      type: object
      required: [content_id, content_type]
      properties:
        content_id:
          type: string
          format: uuid
        content_type:
          $ref: "#/components/schemas/ContentType"

    SavedContentJSON:
      type: object
      required: [user_id, content_id, content_type, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        content_type:
          $ref: "#/components/schemas/ContentType"
        created_at:
          type: string
          format: date-time

    ListSavedContentResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SavedContentJSON"
        meta:
          $ref: "#/components/schemas/PageMeta"

    CreateStanceRequest:
      type: object
      required: [label, color, description]
      properties:
        label:
          type: string
          example: "Yes"
        color:
          type: string
          description: Hex color code (e.g. #aabbcc)
          example: "#00aa00"
        description:
          type: string
          example: "Ban most cars, prioritize public transit."

    StanceJSON:
      type: object
      required: [id, label, color, description]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        color:
          type: string
          example: "#00aa00"
        description:
          type: string

    UpdateStanceJSON:
      type: object
      required: [id, label, color, description]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        color:
          type: string
        description:
          type: string

    CreatePostRequest:
      type: object
      required: [title, content, tags, stances]
      properties:
        title:
          type: string
          example: "Should we ban cars in city centers?"
        content:
          type: string
          example: "I think we should gradually restrict car access..."
        tags:
          type: array
          items:
            type: string
          example: ["mobility", "climate"]
        stances:
          type: array
          description: Must contain at least 3 unique stances.
          items:
            $ref: "#/components/schemas/CreateStanceRequest"

    UpdatePostRequest:
      type: object
      required: [title, content, tags, stances]
      properties:
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        stances:
          type: array
          items:
            $ref: "#/components/schemas/UpdateStanceJSON"

    PostJSON:
      type: object
      required: [id, author_id, title, content, tags, stances, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        stances:
          type: array
          items:
            $ref: "#/components/schemas/StanceJSON"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GetPostResponse:
      type: object
      required: [post, meta]
      properties:
        post:
          $ref: "#/components/schemas/PostJSON"
        meta:
          $ref: "#/components/schemas/EmptyMeta"

    ListPostsResponse:
      type: object
      required: [posts, meta]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/PostJSON"
        meta:
          $ref: "#/components/schemas/PageMeta"

    CreateCommentRequest:
      type: object
      required: [stance_id, content]
      properties:
        stance_id:
          type: string
          format: uuid
          description: Must be one of the post stances.
        content:
          type: string
          example: "I strongly agree."
        reply_to_id:
          type: string
          format: uuid
          nullable: true
          description: If provided, creates a reply to another comment.

    UpdateCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          example: "Edited content."

    CommentJSON:
      type: object
      required: [id, post_id, author_id, stance_id, content, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        stance_id:
          type: string
          format: uuid
        reply_to_id:
          nullable: true
          type: string
          format: uuid
          description: Null if this is a root comment.
        content:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GetCommentResponse:
      type: object
      required: [comment, meta]
      properties:
        comment:
          $ref: "#/components/schemas/CommentJSON"
        meta:
          $ref: "#/components/schemas/EmptyMeta"

    UpdateCommentResponse:
      type: object
      required: [comment, meta]
      properties:
        comment:
          $ref: "#/components/schemas/CommentJSON"
        meta:
          $ref: "#/components/schemas/EmptyMeta"

    ListCommentsResponse:
      type: object
      required: [comments, meta]
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/CommentJSON"
        meta:
          $ref: "#/components/schemas/PageMeta"